<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}메모 게시판{% endblock %}</title>
    <style>
      body { max-width: 760px; margin: 3rem auto; padding: 0 1rem; color: #222; font: 16px/1.6 sans-serif; }
      header, .actions { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
      a { color: #1459a6; }
      .button { display: inline-block; padding: .45rem .8rem; border: 1px solid #bbb; border-radius: 4px; text-decoration: none; background: #fff; color: #222; cursor: pointer; font: inherit; }
      .memo { padding: 1rem 0; border-bottom: 1px solid #ddd; }
      label { display: block; margin: 1rem 0 .25rem; font-weight: bold; }
      input, textarea { box-sizing: border-box; width: 100%; padding: .65rem; font: inherit; }
      textarea { min-height: 12rem; }
      .content { white-space: pre-wrap; }
      .muted { color: #666; }
    </style>
  </head>
  <body>
    <header>
      <a href="/" style="color: inherit; text-decoration: none"><strong>메모 게시판</strong></a>
      <nav><a href="/memos/">메모 목록</a> · <a href="/memos/new">메모 등록</a></nav>
    </header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
