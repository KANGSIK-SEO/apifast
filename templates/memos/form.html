{% extends "base.html" %}

{% if memo %}
  {% set page_title = "메모 수정" %}
{% else %}
  {% set page_title = "메모 등록" %}
{% endif %}
{% block title %}{{ page_title }}{% endblock %}
{% block content %}
  <h1>{{ page_title }}</h1>
  <form action="{{ action }}" method="post">
    <label for="title">제목</label>
    <input id="title" name="title" type="text" maxlength="200" required value="{{ memo.title if memo else '' }}">

    <label for="content">내용</label>
    <textarea id="content" name="content" required>{{ memo.content if memo else '' }}</textarea>

    <p class="actions">
      <a class="button" href="/memos/">취소</a>
      <button class="button" type="submit">저장</button>
    </p>
  </form>
{% endblock %}
