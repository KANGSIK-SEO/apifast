{% extends "base.html" %}

{% block title %}{{ memo.title }}{% endblock %}
{% block content %}
  <article>
    <h1>{{ memo.title }}</h1>
    <p class="muted">등록일: {{ memo.created_at.strftime("%Y-%m-%d %H:%M") }}</p>
    <div class="content">{{ memo.content }}</div>
  </article>
  <p class="actions">
    <a class="button" href="/memos/">목록</a>
    <a class="button" href="/memos/{{ memo.id }}/edit">수정</a>
    <form action="/memos/{{ memo.id }}/delete" method="post" onsubmit="return confirm('이 메모를 삭제할까요?');">
      <button class="button" type="submit">삭제</button>
    </form>
  </p>
{% endblock %}
